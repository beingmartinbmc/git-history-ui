name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish-npm:
    name: Verify and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Verify tag matches package version and is on main
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Audit production dependencies
        run: |
          npm run audit:prod
          npm run audit:frontend:prod

      - name: Lint, typecheck, and test
        run: |
          npm run lint
          npm run typecheck
          npm test -- --ci
          npm run --prefix frontend test -- --watch=false --browsers=ChromeHeadless

      - name: Build and smoke
        id: smoke
        run: |
          npm run build
          npm run smoke:action
          package="$(bash scripts/smoke-pack.sh)"
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Package Chrome extension
        run: npm run package:extension

      - name: Upload extension release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chrome-extension
          path: |
            dist/extension/*.zip
            dist/extension/*.sha256
          if-no-files-found: error

      # Publish last so a packaging or upload failure never leaves npm ahead of the GitHub release.
      # It ships the tarball the smoke test installed, not a fresh pack of the tree.
      - name: Publish npm package
        run: npm publish "$PACKAGE" --provenance --access public
        env:
          PACKAGE: ${{ steps.smoke.outputs.package }}
          NODE_AUTH_TOKEN: ${{ secrets.NODE_TOKEN }}

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: publish-npm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chrome-extension
          path: release-assets
      - name: Build curated release body
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-body.md
      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-body.md
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/*.sha256

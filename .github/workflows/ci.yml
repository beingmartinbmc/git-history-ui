name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install backend deps
        run: npm ci

      - name: Install frontend deps
        run: npm ci --prefix frontend

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Audit frontend production dependencies
        run: npm run audit:frontend:prod

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage gate (backend, extension, and action helpers)
        run: npm test -- --ci --coverage

      - name: Test (frontend)
        run: npm run --prefix frontend test -- --watch=false --browsers=ChromeHeadless

      - name: Build
        run: npm run build

      - name: Smoke PR impact action logic
        run: npm run smoke:action

      - name: Smoke packed tarball
        run: bash scripts/smoke-pack.sh

  runtime-compat:
    name: Runtime compatibility
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test backend
        run: npm test -- --ci --runInBand

      - name: Build backend
        run: npm run build:backend

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: git-history-ui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test mounted repository and authentication
        shell: bash
        run: |
          repo="$(mktemp -d)"
          trap 'docker rm -f git-history-ui-ci >/dev/null 2>&1 || true; rm -rf "$repo"' EXIT
          git -C "$repo" init -q -b main
          git -C "$repo" config user.name "CI"
          git -C "$repo" config user.email "ci@example.com"
          echo "smoke" > "$repo/README.md"
          git -C "$repo" add README.md
          git -C "$repo" commit -q -m "test: docker smoke"
          chmod -R a+rX "$repo"

          docker run -d --name git-history-ui-ci \
            -p 127.0.0.1:3000:3000 \
            -e GIT_HISTORY_UI_TOKEN=ci-secret \
            -v "$repo:/repo:ro" \
            git-history-ui:ci

          for attempt in {1..30}; do
            if curl --fail --silent --user ignored:ci-secret \
              "http://127.0.0.1:3000/api/health" >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "${ready:-}" = 1

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "http://127.0.0.1:3000/api/commits")"
          test "$status" = 401
          curl --fail --silent --user ignored:ci-secret \
            "http://127.0.0.1:3000/api/commits?pageSize=1" >/dev/null
